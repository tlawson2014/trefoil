# Trefoil (TFL) — local development network
#
# This file only describes the LOCAL test chains that Ignite starts on your
# PC. Nothing here is the real genesis; that gets written by hand when there
# is a public network. Think of it as the cast list for rehearsals.
#
# Two ways to run it:
#   ignite chain serve            one validator (alice) + the accounts below
#   ignite testnet multi-node     the four validators below, each its own node,
#                                 talking to each other like a real network
#
# Units: 1 TFL = 1,000,000 utfl. Balances below are in utfl.

version: 1
validation: sovereign
default_denom: utfl

accounts:
  # alice runs the single validator in `chain serve` mode and holds the bulk
  # of the test supply.
  - name: alice
    coins: ["90000000000000utfl"]     # 90,000,000 TFL

  # tom sends the test payments in the walkthrough.
  - name: tom
    coins: ["5000000000utfl"]         # 5,000 TFL

  # bob receives them.
  - name: bob
    coins: ["1000000000utfl"]         # 1,000 TFL

  # shop is the account that switches on "final only".
  - name: shop
    coins: ["1000000utfl"]            # 1 TFL

# The faucet hands out free test coins over HTTP (http://localhost:4500).
faucet:
  name: bob
  coins: ["1000000utfl"]

# Validators.
#   `chain serve` uses only the first entry.
#   `testnet multi-node` uses all of them, one node each, with these stakes.
#
# Four validators with EQUAL stake on purpose: CometBFT needs MORE than two
# thirds of the stake online to make blocks. With four equal validators,
# losing one leaves 75% (fine); losing two leaves 50% (the chain pauses until
# one comes back). With three equal validators, losing just one leaves
# exactly 66.7% — not more than two thirds — and the chain would pause. Four
# lets you watch both behaviours.
validators:
  - name: alice
    bonded: "100000000utfl"          # 100 TFL
    app:
      # Feeless: validators refuse nothing for lack of a fee.
      minimum-gas-prices: "0utfl"
  - name: validator1
    bonded: "100000000utfl"
  - name: validator2
    bonded: "100000000utfl"
  - name: validator3
    bonded: "100000000utfl"

genesis:
  app_state:
    undo:
      params:
        # The undo window, in seconds. Every send waits at least minwindow
        # before it is final; the sender can pick anything up to maxwindow.
        # These are the real defaults, not shrunk for testing: two minutes
        # is short enough to sit through in a walkthrough.
        minwindow: "120"
        defaultwindow: "600"
        maxwindow: "86400"
    mint:
      params:
        # Inflation pays validators instead of transaction fees.
        mint_denom: "utfl"
        inflation_rate_change: "0.130000000000000000"
        inflation_max: "0.070000000000000000"
        inflation_min: "0.020000000000000000"
        goal_bonded: "0.670000000000000000"
        blocks_per_year: "6311520"
