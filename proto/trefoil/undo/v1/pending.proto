syntax = "proto3";
package trefoil.undo.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "trefoil/x/undo/types";

// Pending defines the Pending message.
message Pending {
  uint64 id = 1;
  string sender = 2;
  string recipient = 3;
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
  int64 executeat = 5;
}
