syntax = "proto3";
package trefoil.recovery.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "trefoil/x/recovery/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "trefoil/x/recovery"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
