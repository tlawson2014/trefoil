syntax = "proto3";
package trefoil.recovery.v1;

option go_package = "trefoil/x/recovery/types";

// Recovery defines the Recovery message.
message Recovery {
  string account = 1;
  string newaddress = 2;
  string requester = 3;
  repeated string approvals = 4;
  int64 requestedat = 5;
  int64 executeat = 6;
}
