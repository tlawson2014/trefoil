syntax = "proto3";

package trefoil.recovery.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "trefoil/recovery/v1/params.proto";

option go_package = "trefoil/x/recovery/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // SetGuardians defines the SetGuardians RPC.
  rpc SetGuardians(MsgSetGuardians) returns (MsgSetGuardiansResponse);

  // RequestRecovery defines the RequestRecovery RPC.
  rpc RequestRecovery(MsgRequestRecovery) returns (MsgRequestRecoveryResponse);

  // ApproveRecovery defines the ApproveRecovery RPC.
  rpc ApproveRecovery(MsgApproveRecovery) returns (MsgApproveRecoveryResponse);

  // CancelRecovery defines the CancelRecovery RPC.
  rpc CancelRecovery(MsgCancelRecovery) returns (MsgCancelRecoveryResponse);

  // SetSafeDestinations defines the SetSafeDestinations RPC.
  rpc SetSafeDestinations(MsgSetSafeDestinations) returns (MsgSetSafeDestinationsResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "trefoil/x/recovery/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgSetGuardians defines the MsgSetGuardians message.
message MsgSetGuardians {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string guardians = 2;
  uint64 threshold = 3;
}

// MsgSetGuardiansResponse defines the MsgSetGuardiansResponse message.
message MsgSetGuardiansResponse {}

// MsgRequestRecovery defines the MsgRequestRecovery message.
message MsgRequestRecovery {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account = 2;
  string newaddress = 3;
}

// MsgRequestRecoveryResponse defines the MsgRequestRecoveryResponse message.
message MsgRequestRecoveryResponse {}

// MsgApproveRecovery defines the MsgApproveRecovery message.
message MsgApproveRecovery {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account = 2;
}

// MsgApproveRecoveryResponse defines the MsgApproveRecoveryResponse message.
message MsgApproveRecoveryResponse {}

// MsgCancelRecovery defines the MsgCancelRecovery message.
message MsgCancelRecovery {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string account = 2;
}

// MsgCancelRecoveryResponse defines the MsgCancelRecoveryResponse message.
message MsgCancelRecoveryResponse {}

// MsgSetSafeDestinations defines the MsgSetSafeDestinations message.
message MsgSetSafeDestinations {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string addresses = 2;
}

// MsgSetSafeDestinationsResponse defines the MsgSetSafeDestinationsResponse message.
message MsgSetSafeDestinationsResponse {}
