# Release builds are manual for now. Trigger from the Actions tab
# (Actions -> Release -> Run workflow) when there is something worth
# shipping. Ignite's original version ran on every push and tried to
# publish a "latest" prerelease, which fails without extra setup.
name: Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build trefoild
        run: go build -o release/trefoild ./cmd/trefoild
        env:
          GOFLAGS: "-buildvcs=false"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: trefoild-linux-amd64
          path: release/trefoild
