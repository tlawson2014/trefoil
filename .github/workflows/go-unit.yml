# Runs the test suite on every push and pull request, so the green tick
# on GitHub means "the recovery module still passes all its tests".
name: Unit tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Tests
        run: go test ./x/... ./app/...
        env:
          GOFLAGS: "-buildvcs=false"
